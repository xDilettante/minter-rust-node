[package]
license = "MIT"
name = "minter-p2p"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
curve25519-dalek-ng = { version = "=4.1.1", default-features = false, features = ["u64_backend"] }
ed25519-consensus = "2"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
prost = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
ripemd = "=0.1.3"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tendermint = { version = "=0.40.4", default-features = false, features = ["rust-crypto"] }
tendermint-config = "=0.40.4"
tendermint-p2p = "=0.40.4"
tendermint-proto = "=0.40.4"
tendermint-std-ext = "=0.40.4"

[dev-dependencies]
hex = "0.4"
