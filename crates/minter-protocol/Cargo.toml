[package]
license = "MIT"
name = "minter-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-rlp = "0.3.16"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
thiserror = "2"

[dev-dependencies]
anyhow = "1"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
