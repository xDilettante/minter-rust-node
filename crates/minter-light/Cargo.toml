[package]
license = "MIT"
name = "minter-light"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-rlp = "0.3.17"
anyhow = "1"
hex = "0.4"
minter-iavl = { path = "../minter-iavl" }
minter-protocol = { path = "../minter-protocol" }
num-bigint = "0.4"
prost = "0.13"
redb = "=4.5.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendermint = "=0.40.4"
tendermint-light-client = { version = "=0.40.4", default-features = false, features = ["rust-crypto"] }
tendermint-proto = "=0.40.4"
tendermint-rpc = "=0.40.4"
