[package]
license = "MIT"
name = "minter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
